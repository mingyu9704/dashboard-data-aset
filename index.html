<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Dashboard Monitoring Aset</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    #f4f7fb;

  color:
    #24324a;

}


.container {

  max-width:
    1400px;

  margin:
    auto;

  padding:
    25px;

}


/* =====================================================
   HEADER
===================================================== */

.header {

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #1e40af
    );

  color:
    white;

  padding:
    35px;

  border-radius:
    18px;

  margin-bottom:
    25px;

}


.header h1 {

  margin:
    0 0 10px;

  font-size:
    36px;

}


.header p {

  margin:
    0;

  font-size:
    20px;

}


/* =====================================================
   STATISTIK
===================================================== */

.cards {

  display:
    grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap:
    20px;

  margin-bottom:
    25px;

}


.card {

  background:
    white;

  padding:
    25px;

  border-radius:
    16px;

  box-shadow:
    0 5px 18px
    rgba(
      0,
      0,
      0,
      .08
    );

}


.card h3 {

  margin:
    0;

  color:
    #64748b;

  font-size:
    18px;

}


.number {

  margin-top:
    12px;

  font-size:
    36px;

  font-weight:
    bold;

  color:
    #17345f;

}


/* =====================================================
   CONTROL
===================================================== */

.controls {

  display:
    flex;

  gap:
    15px;

  margin-bottom:
    20px;

}


#searchInput {

  flex:
    1;

  padding:
    15px 18px;

  border:
    1px solid
    #d1d5db;

  border-radius:
    10px;

  font-size:
    16px;

  outline:
    none;

}


#searchInput:focus {

  border-color:
    #2563eb;

}


button {

  border:
    none;

  border-radius:
    10px;

  padding:
    14px 22px;

  font-size:
    16px;

  font-weight:
    bold;

  cursor:
    pointer;

}


.btn-blue {

  background:
    #2563eb;

  color:
    white;

}


.btn-red {

  background:
    #dc2626;

  color:
    white;

}


button:hover {

  opacity:
    .9;

}


/* =====================================================
   ERROR
===================================================== */

.error-box {

  display:
    none;

  background:
    #fee2e2;

  color:
    #991b1b;

  padding:
    18px;

  border-radius:
    10px;

  margin-bottom:
    20px;

  font-size:
    16px;

}


/* =====================================================
   TABLE
===================================================== */

.table-box {

  background:
    white;

  border-radius:
    16px;

  overflow-x:
    auto;

  box-shadow:
    0 5px 18px
    rgba(
      0,
      0,
      0,
      .08
    );

}


table {

  width:
    100%;

  border-collapse:
    collapse;

  min-width:
    900px;

}


th {

  background:
    #eff6ff;

  color:
    #1e3a8a;

  padding:
    17px;

  text-align:
    left;

  font-size:
    16px;

}


td {

  padding:
    15px 17px;

  border-top:
    1px solid
    #e5e7eb;

}


tr:hover {

  background:
    #f8fafc;

}


/* =====================================================
   BADGE
===================================================== */

.badge {

  display:
    inline-block;

  padding:
    7px 12px;

  border-radius:
    20px;

  font-size:
    13px;

  font-weight:
    bold;

}


.badge-normal {

  background:
    #dcfce7;

  color:
    #166534;

}


.badge-maintenance {

  background:
    #fef3c7;

  color:
    #92400e;

}


.badge-overdue {

  background:
    #fee2e2;

  color:
    #991b1b;

}


/* =====================================================
   LOADING
===================================================== */

.loading,
.empty {

  text-align:
    center;

  padding:
    40px;

  color:
    #64748b;

}


/* =====================================================
   MODAL
===================================================== */

.modal {

  display:
    none;

  position:
    fixed;

  z-index:
    9999;

  left:
    0;

  top:
    0;

  width:
    100%;

  height:
    100%;

  background:
    rgba(
      0,
      0,
      0,
      .55
    );

  padding:
    20px;

  overflow:
    auto;

}


.modal-content {

  background:
    white;

  max-width:
    550px;

  margin:
    40px auto;

  padding:
    25px;

  border-radius:
    18px;

}


.modal-header {

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  margin-bottom:
    20px;

}


.modal-header h2 {

  margin:
    0;

}


.close {

  font-size:
    30px;

  cursor:
    pointer;

}


.form-group {

  margin-bottom:
    18px;

}


.form-group label {

  display:
    block;

  margin-bottom:
    8px;

  font-weight:
    bold;

}


.form-group input,
.form-group select,
.form-group textarea {

  width:
    100%;

  padding:
    13px;

  border:
    1px solid
    #d1d5db;

  border-radius:
    9px;

  font-size:
    15px;

}


textarea {

  min-height:
    110px;

  resize:
    vertical;

}


.btn-submit {

  width:
    100%;

  background:
    #2563eb;

  color:
    white;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (
  max-width: 900px
) {

  .cards {

    grid-template-columns:
      repeat(2, 1fr);

  }

}


@media (
  max-width: 600px
) {

  .container {

    padding:
      15px;

  }


  .cards {

    grid-template-columns:
      1fr;

  }


  .controls {

    flex-direction:
      column;

  }


  .header h1 {

    font-size:
      27px;

  }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

  <h1>
    📊 Dashboard Monitoring Aset
  </h1>

  <p>
    Monitoring kondisi dan status data aset
  </p>

</div>


<!-- =====================================================
     STATISTIK
===================================================== -->

<div class="cards">


  <div class="card">

    <h3>
      📦 Total Aset
    </h3>

    <div
      class="number"
      id="totalAset"
    >
      0
    </div>

  </div>


  <div class="card">

    <h3>
      ✅ Normal
    </h3>

    <div
      class="number"
      id="totalNormal"
    >
      0
    </div>

  </div>


  <div class="card">

    <h3>
      🔧 Maintenance
    </h3>

    <div
      class="number"
      id="totalMaintenance"
    >
      0
    </div>

  </div>


  <div class="card">

    <h3>
      ⚠️ Overdue / Rusak
    </h3>

    <div
      class="number"
      id="totalOverdue"
    >
      0
    </div>

  </div>


</div>


<!-- =====================================================
     SEARCH + BUTTON
===================================================== -->

<div class="controls">


  <input
    type="text"
    id="searchInput"
    placeholder="🔍 Cari ID, nama aset, kondisi, atau status..."
  >


  <button
    class="btn-red"
    onclick="bukaModal()"
  >
    ⚠️ Lapor Kerusakan
  </button>


  <button
    class="btn-blue"
    onclick="ambilData()"
  >
    🔄 Refresh
  </button>


</div>


<!-- =====================================================
     ERROR
===================================================== -->

<div
  id="errorBox"
  class="error-box"
></div>


<!-- =====================================================
     TABEL
===================================================== -->

<div class="table-box">

<table>

<thead>

<tr>

  <th>
    🏷 Asset ID
  </th>

  <th>
    📦 Nama Barang
  </th>

  <th>
    ♡ Kondisi
  </th>

  <th>
    📅 Tanggal Periksa
  </th>

  <th>
    ⚑ Status
  </th>

  <th>
    🔔 Alert
  </th>

</tr>

</thead>


<tbody id="tabelData">

<tr>

<td
  colspan="6"
  class="loading"
>
  ⏳ Mengambil data aset...
</td>

</tr>

</tbody>

</table>

</div>


<div
  style="
    text-align:center;
    margin-top:20px;
    color:#64748b;
  "
>

  Update terakhir:

  <span id="updateTerakhir">
    -
  </span>

</div>


</div>


<!-- =====================================================
     MODAL LAPORAN
===================================================== -->

<div
  id="modalLaporan"
  class="modal"
>

<div class="modal-content">


  <div class="modal-header">

    <h2>
      ⚠️ Lapor Kerusakan
    </h2>

    <span
      class="close"
      onclick="tutupModal()"
    >
      ×
    </span>

  </div>


  <div class="form-group">

    <label>
      Pilih Aset
    </label>

    <select
      id="laporIdAset"
    >

      <option value="">
        -- Pilih Aset --
      </option>

    </select>

  </div>


  <div class="form-group">

    <label>
      Nama Pelapor
    </label>

    <input
      type="text"
      id="laporNamaPelapor"
      placeholder="Masukkan nama pelapor"
    >

  </div>


  <div class="form-group">

    <label>
      Kondisi
    </label>

    <select
      id="laporKondisi"
    >

      <option value="Rusak">
        Rusak
      </option>

      <option value="Perlu Maintenance">
        Perlu Maintenance
      </option>

    </select>

  </div>


  <div class="form-group">

    <label>
      Keterangan Kerusakan
    </label>

    <textarea
      id="laporKeterangan"
      placeholder="Jelaskan kerusakan aset..."
    ></textarea>

  </div>


  <button
    id="btnKirim"
    class="btn-submit"
    onclick="kirimLaporan()"
  >
    Kirim Laporan
  </button>


</div>

</div>


<script>


// =====================================================
// URL APPS SCRIPT
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbxx1unGPnfnuSLE_muXYrbzHKMwT0i_4f92aaPGDBcUFnU10B7RsZyLoLaBSr_qhqb1/exec";


let semuaData = [];


// =====================================================
// AMBIL DATA
// =====================================================

function ambilData() {


  const tabel =
    document.getElementById("tabelData");


  const errorBox =
    document.getElementById("errorBox");


  errorBox.style.display =
    "none";


  tabel.innerHTML = `

    <tr>

      <td
        colspan="6"
        class="loading"
      >
        ⏳ Mengambil data aset...
      </td>

    </tr>

  `;


  // Hapus script sebelumnya

  const lama =
    document.getElementById("apiJsonp");

  if (lama) {
    lama.remove();
  }


  // Nama callback unik

  const callbackName =
    "terimaData_" +
    Date.now();


  // ===================================================
  // CALLBACK
  // ===================================================

  window[callbackName] =
    function(hasil) {


      console.log(
        "Data dari Apps Script:",
        hasil
      );


      if (!hasil) {

        tampilkanError(
          "Data dari Apps Script kosong."
        );

        return;

      }


      if (
        hasil.success === false
      ) {

        tampilkanError(
          hasil.message ||
          "Apps Script mengalami error."
        );

        return;

      }


      // Simpan data

      semuaData =
        Array.isArray(hasil.data)
          ? hasil.data
          : [];


      // Tampilkan

      tampilkanData(
        semuaData
      );


      // Statistik

      updateStatistik(
        hasil
      );


      // Isi pilihan aset

      isiPilihanAset();


      // Waktu update

      document.getElementById(
        "updateTerakhir"
      ).textContent =
        hasil.updateTerakhir ||
        "-";


      // Bersihkan callback

      delete window[callbackName];

    };


  // ===================================================
  // BUAT SCRIPT JSONP
  // ===================================================

  const script =
    document.createElement("script");


  script.id =
    "apiJsonp";


  script.src =
    API_URL +
    "?callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      tampilkanError(
        "Gagal terhubung ke Apps Script. Pastikan deployment Web App menggunakan akses Anyone."
      );

      delete window[callbackName];

    };


  document.body.appendChild(
    script
  );

}


// =====================================================
// ERROR
// =====================================================

function tampilkanError(pesan) {


  const errorBox =
    document.getElementById(
      "errorBox"
    );


  const tabel =
    document.getElementById(
      "tabelData"
    );


  errorBox.style.display =
    "block";


  errorBox.textContent =
    "Error: " +
    pesan;


  tabel.innerHTML = `

    <tr>

      <td
        colspan="6"
        class="empty"
      >
        ❌ Gagal mengambil data aset.
      </td>

    </tr>

  `;

}


// =====================================================
// TAMPILKAN DATA
// =====================================================

function tampilkanData(data) {


  const tabel =
    document.getElementById(
      "tabelData"
    );


  tabel.innerHTML =
    "";


  if (
    !data ||
    data.length === 0
  ) {

    tabel.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty"
        >
          Tidak ada data aset.
        </td>

      </tr>

    `;

    return;

  }


  data.forEach(
    function(aset) {


      const id =
        aset.id || "-";


      const nama =
        aset.nama || "-";


      const kondisi =
        aset.kondisi || "-";


      const tanggal =
        aset.tanggalPeriksa || "-";


      const status =
        aset.status || "-";


      const alert =
        aset.alert || "-";


      const statusLower =
        String(status)
          .toLowerCase();


      const kondisiLower =
        String(kondisi)
          .toLowerCase();


      let badgeClass =
        "badge-normal";


      if (

        statusLower.includes(
          "maintenance"
        )

        ||

        kondisiLower.includes(
          "maintenance"
        )

      ) {

        badgeClass =
          "badge-maintenance";

      }


      if (

        statusLower.includes(
          "overdue"
        )

        ||

        statusLower.includes(
          "rusak"
        )

        ||

        kondisiLower.includes(
          "rusak"
        )

        ||

        kondisiLower.includes(
          "broken"
        )

      ) {

        badgeClass =
          "badge-overdue";

      }


      tabel.innerHTML += `

        <tr>

          <td>
            ${escapeHTML(id)}
          </td>

          <td>
            ${escapeHTML(nama)}
          </td>

          <td>
            ${escapeHTML(kondisi)}
          </td>

          <td>
            ${escapeHTML(tanggal)}
          </td>

          <td>

            <span
              class="badge ${badgeClass}"
            >
              ${escapeHTML(status)}
            </span>

          </td>

          <td>
            ${escapeHTML(alert)}
          </td>

        </tr>

      `;

    }
  );

}


// =====================================================
// STATISTIK
// =====================================================

function updateStatistik(hasil) {


  if (
    hasil &&
    hasil.statistik
  ) {


    document.getElementById(
      "totalAset"
    ).textContent =
      hasil.statistik.total || 0;


    document.getElementById(
      "totalNormal"
    ).textContent =
      hasil.statistik.normal || 0;


    document.getElementById(
      "totalMaintenance"
    ).textContent =
      hasil.statistik.maintenance || 0;


    document.getElementById(
      "totalOverdue"
    ).textContent =
      hasil.statistik.overdue || 0;


  }

}


// =====================================================
// SEARCH
// =====================================================

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    function() {


      const keyword =
        this.value
          .toLowerCase()
          .trim();


      if (!keyword) {

        tampilkanData(
          semuaData
        );

        return;

      }


      const hasil =
        semuaData.filter(
          function(aset) {


            return (

              String(
                aset.id || ""
              )
              .toLowerCase()
              .includes(keyword)

              ||

              String(
                aset.nama || ""
              )
              .toLowerCase()
              .includes(keyword)

              ||

              String(
                aset.kondisi || ""
              )
              .toLowerCase()
              .includes(keyword)

              ||

              String(
                aset.status || ""
              )
              .toLowerCase()
              .includes(keyword)

            );

          }
        );


      tampilkanData(
        hasil
      );

    }
  );


// =====================================================
// ISI PILIHAN ASET
// =====================================================

function isiPilihanAset() {


  const select =
    document.getElementById(
      "laporIdAset"
    );


  select.innerHTML = `

    <option value="">
      -- Pilih Aset --
    </option>

  `;


  semuaData.forEach(
    function(aset) {


      if (!aset.id) {
        return;
      }


      const option =
        document.createElement(
          "option"
        );


      option.value =
        aset.id;


      option.textContent =
        aset.id +
        " - " +
        (aset.nama || "");


      select.appendChild(
        option
      );

    }
  );

}


// =====================================================
// BUKA MODAL
// =====================================================

function bukaModal() {

  document.getElementById(
    "modalLaporan"
  ).style.display =
    "block";


  isiPilihanAset();

}


// =====================================================
// TUTUP MODAL
// =====================================================

function tutupModal() {

  document.getElementById(
    "modalLaporan"
  ).style.display =
    "none";

}


// =====================================================
// KLIK DI LUAR MODAL
// =====================================================

window.addEventListener(
  "click",
  function(event) {


    const modal =
      document.getElementById(
        "modalLaporan"
      );


    if (
      event.target === modal
    ) {

      tutupModal();

    }

  }
);


// =====================================================
// KIRIM LAPORAN
// =====================================================

function kirimLaporan() {


  const idAset =
    document.getElementById(
      "laporIdAset"
    ).value;


  const namaPelapor =
    document.getElementById(
      "laporNamaPelapor"
    ).value
    .trim();


  const kondisi =
    document.getElementById(
      "laporKondisi"
    ).value;


  const keterangan =
    document.getElementById(
      "laporKeterangan"
    ).value
    .trim();


  const tombol =
    document.getElementById(
      "btnKirim"
    );


  // Validasi

  if (
    !idAset ||
    !namaPelapor ||
    !keterangan
  ) {

    alert(
      "Mohon lengkapi semua data laporan."
    );

    return;

  }


  tombol.disabled =
    true;


  tombol.textContent =
    "⏳ Mengirim...";


  // ===================================================
  // IFRAME
  // ===================================================

  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.name =
    "laporan_" +
    Date.now();


  iframe.style.display =
    "none";


  document.body.appendChild(
    iframe
  );


  // ===================================================
  // FORM
  // ===================================================

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    API_URL;


  form.target =
    iframe.name;


  form.style.display =
    "none";


  tambahInput(
    form,
    "idAset",
    idAset
  );


  tambahInput(
    form,
    "namaPelapor",
    namaPelapor
  );


  tambahInput(
    form,
    "kondisi",
    kondisi
  );


  tambahInput(
    form,
    "keterangan",
    keterangan
  );


  document.body.appendChild(
    form
  );


  form.submit();


  // ===================================================
  // SELESAI
  // ===================================================

  setTimeout(
    function() {


      alert(
        "✅ Laporan berhasil dikirim!"
      );


      tutupModal();


      document.getElementById(
        "laporIdAset"
      ).value =
        "";


      document.getElementById(
        "laporNamaPelapor"
      ).value =
        "";


      document.getElementById(
        "laporKeterangan"
      ).value =
        "";


      tombol.disabled =
        false;


      tombol.textContent =
        "Kirim Laporan";


      form.remove();

      iframe.remove();


    },
    1500
  );

}


// =====================================================
// TAMBAH INPUT
// =====================================================

function tambahInput(
  form,
  nama,
  value
) {


  const input =
    document.createElement(
      "input"
    );


  input.type =
    "hidden";


  input.name =
    nama;


  input.value =
    value;


  form.appendChild(
    input
  );

}


// =====================================================
// AMANKAN HTML
// =====================================================

function escapeHTML(value) {


  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


// =====================================================
// JALANKAN SAAT WEBSITE DIBUKA
// =====================================================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    ambilData();

  }
);

</script>

</body>

</html>

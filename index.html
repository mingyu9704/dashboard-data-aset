<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Data Aset</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #24324a;
    }

    .container {
      max-width: 1300px;
      margin: auto;
      padding: 30px 20px;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
      padding: 28px;
      border-radius: 16px;
      margin-bottom: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.07);
    }

    .card h3 {
      margin: 0;
      font-size: 14px;
      color: #64748b;
    }

    .card .number {
      font-size: 30px;
      font-weight: bold;
      margin-top: 10px;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    input,
    select,
    button {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    input,
    select {
      border: 1px solid #d1d5db;
      background: white;
    }

    #searchInput {
      flex: 1;
      min-width: 220px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .table-box {
      background: white;
      border-radius: 14px;
      overflow-x: auto;
      box-shadow: 0 4px 14px rgba(0,0,0,0.07);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th {
      background: #eff6ff;
      text-align: left;
      padding: 14px;
      color: #1e3a8a;
    }

    td {
      padding: 13px 14px;
      border-top: 1px solid #e5e7eb;
    }

    tr:hover {
      background: #f8fafc;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }

    .normal {
      background: #dcfce7;
      color: #166534;
    }

    .warning {
      background: #fef3c7;
      color: #92400e;
    }

    .overdue {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    /* MODAL LAPORAN */

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      padding: 20px;
      overflow: auto;
    }

    .modal-content {
      background: white;
      max-width: 550px;
      margin: 50px auto;
      padding: 25px;
      border-radius: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close {
      font-size: 28px;
      cursor: pointer;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
    }

    textarea {
      min-height: 100px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: Arial, sans-serif;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 24px;
      }

      .container {
        padding: 15px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>📊 Dashboard Monitoring Aset</h1>
      <p>Monitoring kondisi dan status data aset secara real-time</p>
    </div>


    <div class="cards">

      <div class="card">
        <h3>Total Aset</h3>
        <div class="number" id="totalAset">0</div>
      </div>

      <div class="card">
        <h3>Normal</h3>
        <div class="number" id="totalNormal">0</div>
      </div>

      <div class="card">
        <h3>Perlu Dicek</h3>
        <div class="number" id="totalWarning">0</div>
      </div>

      <div class="card">
        <h3>Overdue</h3>
        <div class="number" id="totalOverdue">0</div>
      </div>

    </div>


    <div class="controls">

      <input
        type="text"
        id="searchInput"
        placeholder="🔍 Cari aset..."
      >

      <select id="filterStatus">
        <option value="">Semua Status</option>
        <option value="NORMAL">NORMAL</option>
        <option value="H-4">H-4</option>
        <option value="OVERDUE">OVERDUE</option>
      </select>

      <button
        class="btn-primary"
        onclick="ambilData()"
      >
        🔄 Refresh
      </button>

    </div>


    <div class="table-box">

      <table>

        <thead>
          <tr>
            <th>No</th>
            <th>Nama Aset</th>
            <th>Kode Aset</th>
            <th>Tanggal</th>
            <th>Status</th>
            <th>Alert</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody id="tabelData">

          <tr>
            <td
              colspan="7"
              class="loading"
            >
              Memuat data...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>



  <!-- MODAL LAPORAN -->

  <div
    id="modalLaporan"
    class="modal"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h2>📝 Lapor Kondisi Aset</h2>

        <span
          class="close"
          onclick="tutupLaporan()"
        >
          ×
        </span>

      </div>


      <div class="form-group">

        <label>Nama Aset</label>

        <input
          type="text"
          id="laporNamaAset"
          readonly
        >

      </div>


      <div class="form-group">

        <label>Kode Aset</label>

        <input
          type="text"
          id="laporKodeAset"
          readonly
        >

      </div>


      <div class="form-group">

        <label>Kondisi</label>

        <select id="laporKondisi">

          <option value="Baik">
            Baik
          </option>

          <option value="Rusak Ringan">
            Rusak Ringan
          </option>

          <option value="Rusak">
            Rusak
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>Keterangan</label>

        <textarea
          id="laporKeterangan"
          placeholder="Masukkan keterangan..."
        ></textarea>

      </div>


      <button
        class="btn-primary"
        onclick="kirimLaporan()"
      >
        Kirim Laporan
      </button>

    </div>

  </div>



  <script>

    // =====================================
    // LINK GOOGLE APPS SCRIPT
    // =====================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxx1unGPnfnuSLE_muXYrbzHKMwT0i_4f92aaPGDBcUFnU10B7RsZyLoLaBSr_qhqb1/exec";


    let semuaData = [];



    // =====================================
    // AMBIL DATA DARI GOOGLE SHEETS
    // =====================================

    async function ambilData() {

      const tabel =
        document.getElementById(
          "tabelData"
        );


      tabel.innerHTML = `

        <tr>

          <td
            colspan="7"
            class="loading"
          >

            Memuat data...

          </td>

        </tr>

      `;


      try {

        const response =
          await fetch(API_URL);


        const hasil =
          await response.json();


        console.log(
          "Data dari API:",
          hasil
        );


        if (
          Array.isArray(hasil)
        ) {

          semuaData =
            hasil;

        }

        else if (
          hasil.data
        ) {

          semuaData =
            hasil.data;

        }

        else {

          semuaData =
            [];

        }


        tampilkanData(
          semuaData
        );


        updateStatistik();

      }


      catch (error) {

        console.error(
          error
        );


        tabel.innerHTML = `

          <tr>

            <td
              colspan="7"
              class="empty"
            >

              ❌ Gagal mengambil data.
              Silakan cek koneksi atau Apps Script.

            </td>

          </tr>

        `;

      }

    }



    // =====================================
    // TAMPILKAN DATA
    // =====================================

    function tampilkanData(
      data
    ) {

      const tabel =
        document.getElementById(
          "tabelData"
        );


      tabel.innerHTML =
        "";


      if (
        !data ||
        data.length === 0
      ) {

        tabel.innerHTML = `

          <tr>

            <td
              colspan="7"
              class="empty"
            >

              Tidak ada data.

            </td>

          </tr>

        `;


        return;

      }


      data.forEach(
        function(
          item,
          index
        ) {

          const nama =
            item.namaAset ||
            item.nama ||
            item["Nama Aset"] ||
            "-";


          const kode =
            item.kodeAset ||
            item.kode ||
            item["Kode Aset"] ||
            "-";


          const tanggal =
            item.tanggal ||
            item["Tanggal"] ||
            "-";


          const status =
            item.status ||
            item["Status"] ||
            "-";


          const alert =
            item.alert ||
            item["Alert"] ||
            "-";


          let kelasStatus =
            "normal";


          if (
            String(status)
              .toUpperCase()
              .includes("OVERDUE")
          ) {

            kelasStatus =
              "overdue";

          }

          else if (
            String(status)
              .toUpperCase()
              .includes("H-")
          ) {

            kelasStatus =
              "warning";

          }


          tabel.innerHTML += `

            <tr>

              <td>
                ${index + 1}
              </td>

              <td>
                ${nama}
              </td>

              <td>
                ${kode}
              </td>

              <td>
                ${tanggal}
              </td>

              <td>

                <span
                  class="badge ${kelasStatus}"
                >

                  ${status}

                </span>

              </td>

              <td>
                ${alert}
              </td>

              <td>

                <button
                  class="btn-danger"
                  onclick='bukaLaporan(
                    ${JSON.stringify(
                      String(nama)
                    )},
                    ${JSON.stringify(
                      String(kode)
                    )}
                  )'
                >

                  Lapor

                </button>

              </td>

            </tr>

          `;

        }

      );

    }



    // =====================================
    // UPDATE STATISTIK
    // =====================================

    function updateStatistik() {

      const total =
        semuaData.length;


      let normal =
        0;


      let warning =
        0;


      let overdue =
        0;


      semuaData.forEach(
        function(item) {

          const status =
            String(
              item.status ||
              item["Status"] ||
              ""
            )
            .toUpperCase();


          if (
            status.includes(
              "NORMAL"
            )
          ) {

            normal++;

          }

          else if (
            status.includes(
              "OVERDUE"
            )
          ) {

            overdue++;

          }

          else {

            warning++;

          }

        }

      );


      document.getElementById(
        "totalAset"
      ).textContent =
        total;


      document.getElementById(
        "totalNormal"
      ).textContent =
        normal;


      document.getElementById(
        "totalWarning"
      ).textContent =
        warning;


      document.getElementById(
        "totalOverdue"
      ).textContent =
        overdue;

    }



    // =====================================
    // FILTER & SEARCH
    // =====================================

    document.getElementById(
      "searchInput"
    ).addEventListener(
      "input",
      filterData
    );


    document.getElementById(
      "filterStatus"
    ).addEventListener(
      "change",
      filterData
    );



    function filterData() {

      const kata =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .toLowerCase();


      const statusFilter =
        document
          .getElementById(
            "filterStatus"
          )
          .value
          .toUpperCase();


      const hasil =
        semuaData.filter(
          function(item) {

            const teks =
              JSON.stringify(
                item
              )
              .toLowerCase();


            const status =
              String(
                item.status ||
                item["Status"] ||
                ""
              )
              .toUpperCase();


            const cocokCari =
              teks.includes(
                kata
              );


            const cocokStatus =
              !statusFilter ||
              status ===
              statusFilter;


            return (
              cocokCari &&
              cocokStatus
            );

          }

        );


      tampilkanData(
        hasil
      );

    }



    // =====================================
    // BUKA LAPORAN
    // =====================================

    function bukaLaporan(
      nama,
      kode
    ) {

      document.getElementById(
        "laporNamaAset"
      ).value =
        nama;


      document.getElementById(
        "laporKodeAset"
      ).value =
        kode;


      document.getElementById(
        "modalLaporan"
      ).style.display =
        "block";

    }



    // =====================================
    // TUTUP LAPORAN
    // =====================================

    function tutupLaporan() {

      document.getElementById(
        "modalLaporan"
      ).style.display =
        "none";

    }



    // =====================================
    // KIRIM LAPORAN
    // =====================================

    async function kirimLaporan() {

      const dataLaporan = {

        action:
          "lapor",


        namaAset:
          document.getElementById(
            "laporNamaAset"
          ).value,


        kodeAset:
          document.getElementById(
            "laporKodeAset"
          ).value,


        kondisi:
          document.getElementById(
            "laporKondisi"
          ).value,


        keterangan:
          document.getElementById(
            "laporKeterangan"
          ).value

      };


      try {

        const response =
          await fetch(
            API_URL,
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "text/plain"
              },

              body:
                JSON.stringify(
                  dataLaporan
                )

            }
          );


        const hasil =
          await response.json();


        if (
          hasil.success
        ) {

          alert(
            "✅ Laporan berhasil dikirim!"
          );


          tutupLaporan();


          ambilData();

        }

        else {

          alert(
            "❌ " +
            (
              hasil.message ||
              "Laporan gagal dikirim"
            )
          );

        }

      }


      catch (
        error
      ) {

        console.error(
          error
        );


        alert(
          "❌ Terjadi kesalahan saat mengirim laporan."
        );

      }

    }



    // =====================================
    // MULAI AMBIL DATA
    // =====================================

    ambilData();


  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Data Aset</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #24324a;
    }

    .container {
      max-width: 1300px;
      margin: auto;
      padding: 30px 20px;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
      padding: 28px;
      border-radius: 16px;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.07);
    }

    .card h3 {
      margin: 0;
      font-size: 14px;
      color: #64748b;
    }

    .card .number {
      font-size: 30px;
      font-weight: bold;
      margin-top: 10px;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    input,
    select,
    button {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    input,
    select {
      border: 1px solid #d1d5db;
      background: white;
    }

    #searchInput {
      flex: 1;
      min-width: 220px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .table-box {
      background: white;
      border-radius: 14px;
      overflow-x: auto;
      box-shadow: 0 4px 14px rgba(0,0,0,0.07);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th {
      background: #eff6ff;
      text-align: left;
      padding: 14px;
      color: #1e3a8a;
    }

    td {
      padding: 13px 14px;
      border-top: 1px solid #e5e7eb;
    }

    tr:hover {
      background: #f8fafc;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }

    .normal {
      background: #dcfce7;
      color: #166534;
    }

    .warning {
      background: #fef3c7;
      color: #92400e;
    }

    .overdue {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    /* MODAL LAPORAN */

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      padding: 20px;
      overflow: auto;
    }

    .modal-content {
      background: white;
      max-width: 550px;
      margin: 50px auto;
      padding: 25px;
      border-radius: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close {
      font-size: 28px;
      cursor: pointer;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
    }

    textarea {
      min-height: 100px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: Arial, sans-serif;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 24px;
      }

      .container {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>📊 Dashboard Monitoring Aset</h1>
      <p>Monitoring kondisi dan status data aset</p>
    </div>

    <!-- STATISTIK -->

    <div class="cards">

      <div class="card">
        <h3>📦 Total Aset</h3>
        <div class="number" id="totalAset">0</div>
      </div>

      <div class="card">
        <h3>✅ Normal</h3>
        <div class="number" id="totalNormal">0</div>
      </div>

      <div class="card">
        <h3>🔧 Maintenance</h3>
        <div class="number" id="totalWarning">0</div>
      </div>

      <div class="card">
        <h3>⚠️ Overdue / Rusak</h3>
        <div class="number" id="totalOverdue">0</div>
      </div>

    </div>

    <!-- SEARCH DAN LAPOR -->

    <div class="controls">

      <input
        type="text"
        id="searchInput"
        placeholder="🔍 Cari ID, nama aset, kondisi, atau status..."
      >

      <button
        class="btn-danger"
        onclick="bukaLaporan()"
      >
        ⚠️ Lapor Kerusakan
      </button>

    </div>

    <!-- TABEL -->

    <div class="table-box">

      <table>

        <thead>
          <tr>
            <th>🏷 Asset ID</th>
            <th>📦 Nama Barang</th>
            <th>♡ Kondisi</th>
            <th>📅 Tanggal Periksa</th>
            <th>⚑ Status</th>
            <th>🔔 Alert</th>
          </tr>
        </thead>

        <tbody id="tabelData">

          <tr>
            <td colspan="6" class="loading">
              Memuat data...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

    <p style="text-align:center; color:#64748b; margin-top:20px;">
      🕒 Update terakhir: <span id="updateTerakhir">Memuat...</span>
    </p>

  </div>

  <!-- MODAL LAPORAN -->

  <div id="modalLaporan" class="modal">

    <div class="modal-content">

      <div class="modal-header">

        <h2>⚠️ Lapor Kerusakan</h2>

        <span
          class="close"
          onclick="tutupLaporan()"
        >
          ×
        </span>

      </div>

      <div class="form-group">

        <label>Pilih Aset</label>

        <select id="laporIdAset">
          <option value="">-- Pilih Aset --</option>
        </select>

      </div>

      <div class="form-group">

        <label>Nama Pelapor</label>

        <input
          type="text"
          id="laporNamaPelapor"
          placeholder="Masukkan nama kamu"
        >

      </div>

      <div class="form-group">

        <label>Kondisi</label>

        <select id="laporKondisi">

          <option value="Rusak">
            Rusak
          </option>

          <option value="Perlu Maintenance">
            Perlu Maintenance
          </option>

        </select>

      </div>

      <div class="form-group">

        <label>Deskripsi Kerusakan</label>

        <textarea
          id="laporKeterangan"
          placeholder="Jelaskan kerusakan aset..."
        ></textarea>

      </div>

      <button
        class="btn-primary"
        onclick="kirimLaporan()"
      >
        Kirim Laporan
      </button>

    </div>

  </div>

  <script>

    // =====================================
    // URL GOOGLE APPS SCRIPT BARU
    // =====================================

    const API_URL = "https://script.google.com/macros/s/AKfycbzZjAQIiBnaps-oCEZV89ISiu9tlzyrv2Y_RJLMXXcp5HEUvMbTPfWopeECnNonqaGH/exec";


    let semuaData = [];


    // =====================================
    // AMBIL DATA DARI APPS SCRIPT
    // =====================================

    async function ambilData() {

      const tabel =
        document.getElementById("tabelData");


      try {

        tabel.innerHTML = `
          <tr>
            <td colspan="6" class="loading">
              Memuat data...
            </td>
          </tr>
        `;


        const response =
          await fetch(API_URL);


        const hasil =
          await response.json();


        console.log("Data API:", hasil);


        if (Array.isArray(hasil)) {

          semuaData = hasil;

        } else if (hasil.data) {

          semuaData = hasil.data;

        } else {

          semuaData = [];

        }


        tampilkanData(semuaData);

        updateStatistik(hasil);

        isiPilihanAset();

        document.getElementById(
          "updateTerakhir"
        ).textContent =
          hasil.updateTerakhir ||
          new Date().toLocaleString("id-ID");


      } catch (error) {

        console.error(error);


        tabel.innerHTML = `
          <tr>
            <td colspan="6" class="empty">
              ❌ Gagal mengambil data.
              Silakan cek Apps Script.
            </td>
          </tr>
        `;

      }

    }


    // =====================================
    // TAMPILKAN DATA
    // =====================================

    function tampilkanData(data) {

      const tabel =
        document.getElementById("tabelData");


      tabel.innerHTML = "";


      if (!data || data.length === 0) {

        tabel.innerHTML = `
          <tr>
            <td colspan="6" class="empty">
              Tidak ada data.
            </td>
          </tr>
        `;

        return;

      }


      data.forEach(function(aset) {

        const id =
          aset.id ||
          aset.assetId ||
          "-";


        const nama =
          aset.nama ||
          aset.namaAset ||
          "-";


        const kondisi =
          aset.kondisi ||
          "-";


        const tanggal =
          aset.tanggalPeriksa ||
          aset.tanggal ||
          "-";


        const status =
          aset.status ||
          "-";


        const alert =
          aset.alert ||
          "-";


        let statusClass =
          "normal";


        const statusUpper =
          String(status).toUpperCase();


        if (
          statusUpper.includes("MAINTENANCE")
        ) {

          statusClass =
            "warning";

        }


        if (
          statusUpper.includes("OVERDUE") ||
          String(kondisi).toLowerCase().includes("rusak") ||
          String(kondisi).toLowerCase().includes("broken")
        ) {

          statusClass =
            "overdue";

        }


        tabel.innerHTML += `

          <tr>

            <td>${id}</td>

            <td>${nama}</td>

            <td>${kondisi}</td>

            <td>${tanggal}</td>

            <td>
              <span class="badge ${statusClass}">
                ${status}
              </span>
            </td>

            <td>${alert}</td>

          </tr>

        `;

      });

    }


    // =====================================
    // UPDATE STATISTIK
    // =====================================

    function updateStatistik(hasil) {

      if (hasil.statistik) {

        document.getElementById(
          "totalAset"
        ).textContent =
          hasil.statistik.total || 0;


        document.getElementById(
          "totalNormal"
        ).textContent =
          hasil.statistik.normal || 0;


        document.getElementById(
          "totalWarning"
        ).textContent =
          hasil.statistik.maintenance || 0;


        document.getElementById(
          "totalOverdue"
        ).textContent =
          hasil.statistik.overdue || 0;

        return;

      }


      const total =
        semuaData.length;


      let normal = 0;
      let maintenance = 0;
      let overdue = 0;


      semuaData.forEach(function(aset) {

        const status =
          String(aset.status || "").toLowerCase();

        const kondisi =
          String(aset.kondisi || "").toLowerCase();


        if (
          status.includes("overdue") ||
          kondisi.includes("rusak") ||
          kondisi.includes("broken")
        ) {

          overdue++;

        } else if (
          status.includes("maintenance") ||
          kondisi.includes("maintenance")
        ) {

          maintenance++;

        } else {

          normal++;

        }

      });


      document.getElementById(
        "totalAset"
      ).textContent =
        total;


      document.getElementById(
        "totalNormal"
      ).textContent =
        normal;


      document.getElementById(
        "totalWarning"
      ).textContent =
        maintenance;


      document.getElementById(
        "totalOverdue"
      ).textContent =
        overdue;

    }


    // =====================================
    // SEARCH
    // =====================================

    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        function() {

          const kata =
            this.value.toLowerCase();


          const hasil =
            semuaData.filter(function(aset) {

              return (
                String(aset.id || "")
                  .toLowerCase()
                  .includes(kata)

                ||

                String(aset.nama || "")
                  .toLowerCase()
                  .includes(kata)

                ||

                String(aset.kondisi || "")
                  .toLowerCase()
                  .includes(kata)

                ||

                String(aset.status || "")
                  .toLowerCase()
                  .includes(kata)
              );

            });


          tampilkanData(hasil);

        }
      );


    // =====================================
    // ISI PILIHAN ASET
    // =====================================

    function isiPilihanAset() {

      const pilihan =
        document.getElementById("laporIdAset");


      pilihan.innerHTML =
        `<option value="">-- Pilih Aset --</option>`;


      semuaData.forEach(function(aset) {

        const id =
          aset.id ||
          aset.assetId ||
          "";


        const nama =
          aset.nama ||
          aset.namaAset ||
          "";


        pilihan.innerHTML += `

          <option value="${id}">
            ${id} - ${nama}
          </option>

        `;

      });

    }


    // =====================================
    // BUKA LAPORAN
    // =====================================

    function bukaLaporan() {

      document.getElementById(
        "modalLaporan"
      ).style.display =
        "block";

    }


    // =====================================
    // TUTUP LAPORAN
    // =====================================

    function tutupLaporan() {

      document.getElementById(
        "modalLaporan"
      ).style.display =
        "none";

    }


    // =====================================
    // KIRIM LAPORAN
    // =====================================

    async function kirimLaporan() {

      const idAset =
        document.getElementById(
          "laporIdAset"
        ).value;


      const namaPelapor =
        document.getElementById(
          "laporNamaPelapor"
        ).value;


      const kondisi =
        document.getElementById(
          "laporKondisi"
        ).value;


      const keterangan =
        document.getElementById(
          "laporKeterangan"
        ).value;


      if (
        !idAset ||
        !namaPelapor ||
        !keterangan
      ) {

        alert(
          "Mohon lengkapi laporan terlebih dahulu."
        );

        return;

      }


      const dataLaporan = {

        action:
          "lapor",

        idAset:
          idAset,

        namaPelapor:
          namaPelapor,

        kondisi:
          kondisi,

        keterangan:
          keterangan

      };


      try {

        const response =
          await fetch(
            API_URL,
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "text/plain"
              },

              body:
                JSON.stringify(dataLaporan)

            }
          );


        const hasil =
          await response.json();


        if (hasil.success) {

          alert(
            "✅ Laporan berhasil dikirim!"
          );


          tutupLaporan();


          document.getElementById(
            "laporNamaPelapor"
          ).value =
            "";


          document.getElementById(
            "laporKeterangan"
          ).value =
            "";


          ambilData();

        } else {

          alert(
            "❌ " +
            (
              hasil.message ||
              "Laporan gagal dikirim."
            )
          );

        }

      } catch (error) {

        console.error(error);

        alert(
          "❌ Terjadi kesalahan saat mengirim laporan."
        );

      }

    }


    // =====================================
    // MULAI
    // =====================================

    ambilData();

  </script>

</body>
</html>
